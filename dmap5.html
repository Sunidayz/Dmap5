<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fast AI Vision Detector</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 5px 0 12px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 12px;
}

button,
label {
    background: #222;
    border: 1px solid #444;
    color: white;
    padding: 10px 13px;
    border-radius: 8px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

button:hover:not(:disabled),
label:hover {
    background: #333;
}

input {
    display: none;
}

#stage {
    position: relative;
    width: 100%;
    max-width: 1100px;
    margin: auto;
    background: black;
    overflow: hidden;
    border-radius: 10px;
}

#video {
    display: block;
    width: 100%;
    height: auto;
}

#overlay {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}

#status {
    margin-top: 10px;
    color: #00ff00;
    font-weight: bold;
}

#info {
    margin-top: 5px;
    color: #aaa;
    font-size: 14px;
}
</style>
</head>

<body>

<h2>⚡ Fast AI Vision Detector</h2>

<div class="controls">

<button id="screenButton" disabled>
🖥️ Share Screen
</button>

<button id="cameraButton" disabled>
📷 Camera
</button>

<label>
🖼️ Photo
<input id="photoInput" type="file" accept="image/*">
</label>

<label>
🎥 Video
<input id="videoInput" type="file" accept="video/*">
</label>

<button id="stopButton">
⛔ Stop
</button>

</div>

<div id="stage">

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="overlay"></canvas>

</div>

<div id="status">
⏳ Loading AI...
</div>

<div id="info"></div>


<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

const screenButton =
    document.getElementById("screenButton");

const cameraButton =
    document.getElementById("cameraButton");

const stopButton =
    document.getElementById("stopButton");

const photoInput =
    document.getElementById("photoInput");

const videoInput =
    document.getElementById("videoInput");


let model = null;
let stream = null;

let running = false;
let processing = false;

let lastDetectionTime = 0;


/*
    Faster detection interval.

    Lower = more frequent detection.
    Higher = less CPU usage.
*/

const DETECTION_INTERVAL = 120;


/* =========================
   LOAD AI
========================= */

async function loadAI() {

    try {

        status.textContent =
            "⏳ Loading AI...";

        info.textContent =
            "Starting TensorFlow.js CPU engine...";


        /*
            IMPORTANT:

            We intentionally DO NOT use WebGL.

            This prevents the WebGL initialization
            from getting stuck on some devices.
        */

        await tf.setBackend("cpu");

        await tf.ready();


        info.textContent =
            "Loading object detection model...";


        model = await cocoSsd.load({
            base: "lite_mobilenet_v2"
        });


        /*
            AI is now ready.
        */

        status.textContent =
            "🟢 AI READY";

        info.textContent =
            "CPU detection enabled";


        /*
            Enable the buttons only after
            the model has successfully loaded.
        */

        screenButton.disabled = false;
        cameraButton.disabled = false;


    } catch (error) {

        console.error(error);

        status.textContent =
            "❌ AI failed to load";

        info.textContent =
            error.message;

    }

}


/* =========================
   RESIZE CANVAS
========================= */

function resizeCanvas() {

    if (
        !video.videoWidth ||
        !video.videoHeight
    ) {
        return;
    }

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;

}


/* =========================
   STOP
========================= */

function stopEverything() {

    running = false;
    processing = false;


    if (stream) {

        stream
            .getTracks()
            .forEach(track => track.stop());

        stream = null;

    }


    video.pause();

    video.srcObject = null;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (model) {

        status.textContent =
            "🟢 AI READY";

        info.textContent =
            "Waiting for a camera, screen or video";

    }

}


/* =========================
   SCREEN SHARE
========================= */

async function shareScreen() {

    if (!model) return;

    stopEverything();

    try {

        stream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: {
                        frameRate: {
                            ideal: 30,
                            max: 60
                        }
                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        resizeCanvas();


        running = true;


        status.textContent =
            "🟢 Screen detection active";


        const track =
            stream.getVideoTracks()[0];


        track.addEventListener(
            "ended",
            stopEverything
        );


        detectLoop();


    } catch (error) {

        console.error(error);

        status.textContent =
            "🟢 AI READY";

        info.textContent =
            "Screen sharing cancelled";

    }

}


/* =========================
   CAMERA
========================= */

async function startCamera() {

    if (!model) return;

    stopEverything();

    try {

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }
                    },

                    audio: false

                });


        video.srcObject =
            stream;


        await video.play();


        resizeCanvas();


        running = true;


        status.textContent =
            "🟢 Camera detection active";


        detectLoop();


    } catch (error) {

        console.error(error);

        status.textContent =
            "🟢 AI READY";

        info.textContent =
            "Camera error: " + error.message;

    }

}


/* =========================
   FAST DETECTION LOOP
========================= */

async function detectLoop() {

    if (!running) return;


    const now =
        performance.now();


    /*
        Don't start another AI prediction
        while one is already running.
    */

    if (
        processing ||
        now - lastDetectionTime <
        DETECTION_INTERVAL
    ) {

        requestAnimationFrame(
            detectLoop
        );

        return;

    }


    if (
        video.readyState < 2 ||
        video.videoWidth === 0
    ) {

        requestAnimationFrame(
            detectLoop
        );

        return;

    }


    processing = true;

    lastDetectionTime =
        now;


    try {

        /*
            Maximum 10 detections.
            Confidence threshold = 45%.
        */

        const predictions =
            await model.detect(
                video,
                10,
                0.45
            );


        drawDetections(
            predictions
        );


    } catch (error) {

        console.error(error);

    }


    processing = false;


    if (running) {

        requestAnimationFrame(
            detectLoop
        );

    }

}


/* =========================
   DRAW DETECTIONS
========================= */

function drawDetections(
    predictions
) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let people = 0;


    /*
        Video and canvas have the same
        internal dimensions, so coordinates
        map directly.
    */

    for (
        const prediction of predictions
    ) {

        if (
            prediction.class !==
            "person"
        ) {
            continue;
        }


        people++;


        const [
            x,
            y,
            width,
            height
        ] = prediction.bbox;


        /*
            Green box
        */

        ctx.strokeStyle =
            "#00ff00";

        ctx.lineWidth = 3;


        ctx.strokeRect(
            x,
            y,
            width,
            height
        );


        /*
            Center dot
        */

        const centerX =
            x + width / 2;

        const centerY =
            y + height / 2;


        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ff00";

        ctx.fill();


        /*
            Label
        */

        const confidence =
            Math.round(
                prediction.score * 100
            );


        ctx.fillStyle =
            "#00ff00";

        ctx.font =
            "bold 16px Arial";


        ctx.fillText(

            `person ${confidence}%`,

            x,

            Math.max(
                18,
                y - 7
            )

        );


        /*
            Coordinates
        */

        ctx.font =
            "13px Arial";


        ctx.fillText(

            `${Math.round(centerX)}, ${Math.round(centerY)}`,

            x,

            y + height + 17

        );

    }


    info.textContent =
        `People detected: ${people} | ` +
        `Detection interval: ${DETECTION_INTERVAL}ms`;

}


/* =========================
   PHOTO
========================= */

photoInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file || !model)
            return;


        stopEverything();


        const image =
            new Image();


        image.onload =
            async () => {

                canvas.width =
                    image.naturalWidth;

                canvas.height =
                    image.naturalHeight;


                ctx.drawImage(
                    image,
                    0,
                    0
                );


                status.textContent =
                    "🔍 Analyzing photo...";


                const predictions =
                    await model.detect(
                        image,
                        10,
                        0.45
                    );


                drawImageDetections(
                    predictions
                );


                URL.revokeObjectURL(
                    image.src
                );

            };


        image.src =
            URL.createObjectURL(file);

    }
);


/* =========================
   PHOTO DETECTIONS
========================= */

function drawImageDetections(
    predictions
) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    let people = 0;


    for (
        const prediction of predictions
    ) {

        if (
            prediction.class !==
            "person"
        ) {
            continue;
        }


        people++;


        const [
            x,
            y,
            width,
            height
        ] = prediction.bbox;


        ctx.strokeStyle =
            "#00ff00";

        ctx.lineWidth = 3;


        ctx.strokeRect(
            x,
            y,
            width,
            height
        );


        const cx =
            x + width / 2;

        const cy =
            y + height / 2;


        ctx.beginPath();

        ctx.arc(
            cx,
            cy,
            5,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ff00";

        ctx.fill();


        ctx.fillStyle =
            "#00ff00";

        ctx.font =
            "bold 16px Arial";


        ctx.fillText(

            `person ${Math.round(
                prediction.score * 100
            )}%`,

            x,

            Math.max(
                18,
                y - 7
            )

        );

    }


    status.textContent =
        `✅ ${people} person(s) detected`;

}


/* =========================
   VIDEO FILE
========================= */

videoInput.addEventListener(
    "change",
    async event => {

        const file =
            event.target.files[0];

        if (!file || !model)
            return;


        stopEverything();


        video.src =
            URL.createObjectURL(file);


        video.muted = true;

        video.loop = true;


        await video.play();


        resizeCanvas();


        running = true;


        status.textContent =
            "🟢 Video detection active";


        detectLoop();

    }
);


/* =========================
   BUTTONS
========================= */

screenButton.onclick =
    shareScreen;

cameraButton.onclick =
    startCamera;

stopButton.onclick =
    stopEverything;


/* =========================
   RESIZE
========================= */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   START
========================= */

loadAI();

</script>

</body>
</html>
