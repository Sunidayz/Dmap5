<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Vision Screen Detector</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #08090c;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

h2 {
    margin: 18px;
}

.controls {
    padding: 10px;
}

button,
label {
    display: inline-block;
    padding: 11px 17px;
    margin: 5px;
    border: 0;
    border-radius: 8px;
    background: #252630;
    color: white;
    cursor: pointer;
}

button:hover,
label:hover {
    background: #363743;
}

input {
    display: none;
}

#stage {
    position: relative;
    display: inline-block;
    max-width: 96vw;
    max-height: 78vh;
    overflow: hidden;
    border-radius: 10px;
}

#video {
    display: block;
    max-width: 96vw;
    max-height: 78vh;
    background: #000;
}

#overlay {
    position: absolute;
    left: 0;
    top: 0;
    pointer-events: none;
}

#status {
    margin: 10px;
    color: #aaa;
}

#info {
    font-size: 13px;
    color: #777;
}
</style>
</head>

<body>

<h2>AI Vision Detector</h2>

<div class="controls">

    <button id="screenButton">
        🖥️ Share Screen
    </button>

    <button id="cameraButton">
        📷 Camera
    </button>

    <label>
        🖼️ Photo
        <input
            id="photoInput"
            type="file"
            accept="image/*">
    </label>

    <label>
        🎥 Video
        <input
            id="videoInput"
            type="file"
            accept="video/*">
    </label>

    <button id="stopButton">
        ⛔ Stop
    </button>

</div>

<div id="stage">

    <video
        id="video"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

</div>

<div id="status">
    Loading AI...
</div>

<div id="info"></div>

<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("overlay");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const info =
    document.getElementById("info");

let model = null;
let stream = null;
let running = false;
let processing = false;


/* =========================================
   LOAD AI
========================================= */

async function loadAI() {

    try {

        status.textContent =
            "Loading AI...";

        await tf.setBackend("cpu");
        await tf.ready();

        model =
            await cocoSsd.load({
                base: "lite_mobilenet_v2"
            });

        status.textContent =
            "AI ready.";

        info.textContent =
            "Select a screen, camera, photo or video.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "AI error: " + error.message;
    }
}


/* =========================================
   SIZE CANVAS
========================================= */

function resizeCanvas() {

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;
}


/* =========================================
   START SCREEN SHARE
========================================= */

async function shareScreen() {

    if (!model) {
        status.textContent =
            "AI is still loading.";
        return;
    }

    stopEverything();

    try {

        stream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: {
                        frameRate: {
                            ideal: 30,
                            max: 60
                        }
                    },

                    audio: false
                });

        video.srcObject =
            stream;

        await video.play();

        resizeCanvas();

        running = true;

        status.textContent =
            "Screen sharing active.";

        info.textContent =
            "Choose your PS Remote Play window or entire screen.";

        /*
         * If the user presses "Stop sharing"
         * in the browser UI.
         */

        const track =
            stream.getVideoTracks()[0];

        track.addEventListener(
            "ended",
            stopEverything
        );

        detectLoop();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Screen sharing cancelled.";
    }
}


/* =========================================
   START CAMERA
========================================= */

async function startCamera() {

    if (!model) {
        status.textContent =
            "AI is still loading.";
        return;
    }

    stopEverything();

    try {

        stream =
            await navigator.mediaDevices
                .getUserMedia({

                    video: {
                        width: {
                            ideal: 1280
                        },

                        height: {
                            ideal: 720
                        },

                        frameRate: {
                            ideal: 30
                        }
                    },

                    audio: false
                });

        video.srcObject =
            stream;

        await video.play();

        resizeCanvas();

        running = true;

        status.textContent =
            "Camera active.";

        detectLoop();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Camera error: " +
            error.message;
    }
}


/* =========================================
   AI DETECTION
========================================= */

async function detectLoop() {

    if (!running ||
        !model ||
        video.readyState < 2) {

        if (running)
            requestAnimationFrame(
                detectLoop
            );

        return;
    }

    /*
     * Prevent overlapping AI calculations.
     */

    if (processing) {

        requestAnimationFrame(
            detectLoop
        );

        return;
    }

    processing = true;

    try {

        const predictions =
            await model.detect(video);

        drawDetections(
            predictions
        );

    } catch (error) {

        console.error(
            "Detection:",
            error
        );
    }

    processing = false;

    if (running) {

        requestAnimationFrame(
            detectLoop
        );
    }
}


/* =========================================
   DRAW GREEN DETECTIONS
========================================= */

function drawDetections(predictions) {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    let people = 0;

    for (const prediction of predictions) {

        if (prediction.class !== "person")
            continue;

        people++;

        const [
            x,
            y,
            width,
            height
        ] = prediction.bbox;

        const centerX =
            x + width / 2;

        const centerY =
            y + height / 2;

        const confidence =
            Math.round(
                prediction.score * 100
            );


        /*
         * GREEN BOX
         */

        ctx.strokeStyle =
            "#00ff55";

        ctx.lineWidth = 4;

        ctx.strokeRect(
            x,
            y,
            width,
            height
        );


        /*
         * GREEN CENTER
         */

        ctx.fillStyle =
            "#00ff55";

        ctx.beginPath();

        ctx.arc(
            centerX,
            centerY,
            6,
            0,
            Math.PI * 2
        );

        ctx.fill();


        /*
         * CORNER MARKERS
         */

        const size = 14;

        ctx.lineWidth = 3;

        // Top-left
        ctx.beginPath();
        ctx.moveTo(x, y + size);
        ctx.lineTo(x, y);
        ctx.lineTo(x + size, y);
        ctx.stroke();

        // Top-right
        ctx.beginPath();
        ctx.moveTo(x + width - size, y);
        ctx.lineTo(x + width, y);
        ctx.lineTo(x + width, y + size);
        ctx.stroke();

        // Bottom-left
        ctx.beginPath();
        ctx.moveTo(x, y + height - size);
        ctx.lineTo(x, y + height);
        ctx.lineTo(x + size, y + height);
        ctx.stroke();

        // Bottom-right
        ctx.beginPath();
        ctx.moveTo(
            x + width - size,
            y + height
        );

        ctx.lineTo(
            x + width,
            y + height
        );

        ctx.lineTo(
            x + width,
            y + height - size
        );

        ctx.stroke();


        /*
         * LABEL
         */

        ctx.font =
            "bold 16px Arial";

        ctx.fillStyle =
            "#00ff55";

        ctx.fillText(
            `PERSON ${confidence}%`,
            x,
            Math.max(
                20,
                y - 8
            )
        );


        /*
         * POSITION
         */

        ctx.font =
            "13px Arial";

        ctx.fillText(
            `X:${Math.round(centerX)} Y:${Math.round(centerY)}`,
            x,
            Math.min(
                canvas.height - 8,
                y + height + 18
            )
        );
    }

    status.textContent =
        `AI: ${people} person(s) detected`;
}


/* =========================================
   PHOTO
========================================= */

document
    .getElementById("photoInput")
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];

            if (!file || !model)
                return;

            stopEverything();

            const image =
                new Image();

            image.onload =
                async () => {

                    video.style.display =
                        "none";

                    canvas.style.position =
                        "static";

                    canvas.width =
                        image.naturalWidth;

                    canvas.height =
                        image.naturalHeight;

                    ctx.drawImage(
                        image,
                        0,
                        0
                    );

                    const predictions =
                        await model.detect(
                            image
                        );

                    ctx.drawImage(
                        image,
                        0,
                        0
                    );

                    drawDetections(
                        predictions
                    );
                };

            image.src =
                URL.createObjectURL(file);
        }
    );


/* =========================================
   VIDEO FILE
========================================= */

document
    .getElementById("videoInput")
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];

            if (!file || !model)
                return;

            stopEverything();

            video.style.display =
                "block";

            canvas.style.position =
                "absolute";

            video.src =
                URL.createObjectURL(file);

            video.loop = true;

            video.onloadedmetadata =
                async () => {

                    resizeCanvas();

                    await video.play();

                    running = true;

                    status.textContent =
                        "Analyzing video...";

                    detectLoop();
                };
        }
    );


/* =========================================
   STOP
========================================= */

function stopEverything() {

    running = false;
    processing = false;

    if (stream) {

        stream
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        stream = null;
    }

    video.pause();

    video.srcObject = null;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );
}


/* =========================================
   BUTTONS
========================================= */

document
    .getElementById("screenButton")
    .addEventListener(
        "click",
        shareScreen
    );

document
    .getElementById("cameraButton")
    .addEventListener(
        "click",
        startCamera
    );

document
    .getElementById("stopButton")
    .addEventListener(
        "click",
        stopEverything
    );


loadAI();

</script>

</body>
</html>
